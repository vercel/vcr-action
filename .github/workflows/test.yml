name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and dist check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Verify dist is up to date
        run: |
          if ! git diff --exit-code -- login/dist/ wait-for-optimized-image/dist/; then
            echo "::error::Action dist files are out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E against a local registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Start a mock Vercel API
        run: |
          cat > /tmp/mock-exchange.py <<'PY'
          import base64
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import parse_qs, urlsplit
          from urllib.request import Request, urlopen

          class Handler(BaseHTTPRequestHandler):
              tag_requests = 0
              token_requests = 0

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length).decode()
                  if self.path.endswith("/revoke"):
                      self._send(b"{}", 200)
                      return
                  params = parse_qs(body)
                  ok = "subject_token" in params and params.get("team_id_or_slug") in (["team_test"], ["acme"])
                  Handler.token_requests += 1
                  token = "s3cret" if Handler.token_requests == 1 else "wait-secret"
                  resp = json.dumps({"access_token": token} if ok else {"error": "invalid_request"}).encode()
                  self._send(resp, 200 if ok else 400)

              def do_GET(self):
                  url = urlsplit(self.path)
                  if self.headers.get("Authorization") != "Bearer wait-secret":
                      self._send(b'{}', 401)
                      return
                  if (url.path != "/v1/vcr/repository/docker-image/tags/latest"
                      or parse_qs(url.query) not in (
                          {"teamId": ["team_test"], "projectId": ["prj_test"]},
                          {"slug": ["acme"], "projectId": ["web"]},
                      )):
                      self._send(b'{}', 400)
                      return
                  # Return the real pushed digest with simulated optimization progress.
                  auth = base64.b64encode(b"team_test:s3cret").decode()
                  request = Request(
                      "http://localhost:5000/v2/acme/web/docker-image/manifests/latest",
                      method="HEAD",
                      headers={
                          "Authorization": "Basic " + auth,
                          "Accept": "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json",
                      },
                  )
                  with urlopen(request, timeout=10) as manifest:
                      digest = manifest.headers["Docker-Content-Digest"]
                  Handler.tag_requests += 1
                  self._send(json.dumps({"tag": {
                      "imageId": "img_test",
                      "manifestDigest": digest,
                      "kind": "manifest",
                      "status": "preparing" if Handler.tag_requests == 1 else "ready",
                  }}).encode(), 200)

              def _send(self, resp, code):
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(resp)))
                  self.end_headers()
                  self.wfile.write(resp)

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 8411), Handler).serve_forever()
          PY
          nohup python3 /tmp/mock-exchange.py >/dev/null 2>&1 &

      - name: Allow http for the local registry (podman and buildah)
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          sudo tee /etc/containers/registries.conf.d/localhost-insecure.conf <<'EOF'
          [[registry]]
          location = "localhost:5000"
          insecure = true
          EOF

      - name: Start a local registry with basic auth
        run: |
          mkdir -p /tmp/registry-auth
          docker run --rm --entrypoint htpasswd httpd:2 -Bbn team_test s3cret > /tmp/registry-auth/htpasswd
          docker run -d --name registry -p 5000:5000 \
            -v /tmp/registry-auth:/auth \
            -e REGISTRY_AUTH=htpasswd \
            -e "REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm" \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2

      - name: Log in with the action
        id: login
        uses: ./login
        env:
          VERCEL_API_ORIGIN: http://127.0.0.1:8411
        with:
          team: team_test
          registry: localhost:5000
          engines: docker podman buildah

      - name: Verify outputs and credentials
        env:
          OUT_REGISTRY: ${{ steps.login.outputs.registry }}
          OUT_ENGINES: ${{ steps.login.outputs.engines }}
        run: |
          set -euxo pipefail
          [[ "$OUT_REGISTRY" == "localhost:5000" ]]
          grep -qx docker <<<"$OUT_ENGINES"
          grep -qx podman <<<"$OUT_ENGINES"
          grep -qx buildah <<<"$OUT_ENGINES"
          jq -e '.auths["localhost:5000"]' ~/.docker/config.json
          [[ "$(podman login --get-login localhost:5000)" == "team_test" ]]
          [[ "$(buildah login --get-login localhost:5000)" == "team_test" ]]

      - name: Push with docker
        run: |
          docker pull docker.io/library/busybox
          docker tag docker.io/library/busybox localhost:5000/acme/web/docker-image:latest
          docker push localhost:5000/acme/web/docker-image:latest

      - name: Wait for optimization using an image reference
        id: optimized
        uses: ./wait-for-optimized-image
        timeout-minutes: 2
        env:
          VERCEL_API_ORIGIN: http://127.0.0.1:8411
        with:
          image: vcr.vercel.com/acme/web/docker-image:latest
          timeout-seconds: 60

      - name: Wait for optimization using manual inputs
        id: optimized-manual
        uses: ./wait-for-optimized-image
        timeout-minutes: 2
        env:
          VERCEL_API_ORIGIN: http://127.0.0.1:8411
        with:
          team: team_test
          project: prj_test
          repository: docker-image
          tag: latest
          timeout-seconds: 60

      - name: Promote the local image and verify its digest
        env:
          DIGEST: ${{ steps.optimized.outputs.digest }}
          IMAGE_ID: ${{ steps.optimized.outputs.image-id }}
          MANUAL_DIGEST: ${{ steps.optimized-manual.outputs.digest }}
          MANUAL_IMAGE_ID: ${{ steps.optimized-manual.outputs.image-id }}
          IMAGE: localhost:5000/acme/web/docker-image
        run: |
          set -euo pipefail
          [[ "$IMAGE_ID" == "img_test" ]]
          [[ "$MANUAL_DIGEST" == "$DIGEST" ]]
          [[ "$MANUAL_IMAGE_ID" == "$IMAGE_ID" ]]
          docker tag "$IMAGE:latest" "$IMAGE:promoted"
          docker push "$IMAGE:promoted"
          promoted_digest=$(curl -fsSI -u team_test:s3cret \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "http://localhost:5000/v2/acme/web/docker-image/manifests/promoted" \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
          [[ "$promoted_digest" == "$DIGEST" ]]

      - name: Push with podman
        run: |
          podman pull docker.io/library/busybox
          podman tag docker.io/library/busybox localhost:5000/acme/web/podman-image:latest
          podman push localhost:5000/acme/web/podman-image:latest

      - name: Push with buildah
        run: |
          buildah push docker.io/library/busybox docker://localhost:5000/acme/web/buildah-image:latest

      - name: Verify pushed tags
        run: |
          set -euxo pipefail
          for repo in docker-image podman-image buildah-image; do
            curl -fsu team_test:s3cret "http://localhost:5000/v2/acme/web/$repo/tags/list" \
              | jq -e '.tags | index("latest") != null'
          done

      - name: Log in with an unknown engine (expect failure)
        id: bad-engine
        continue-on-error: true
        uses: ./login
        env:
          VERCEL_API_ORIGIN: http://127.0.0.1:8411
        with:
          team: team_test
          registry: localhost:5000
          engines: nerdctl

      - name: Verify unknown engine failed
        run: |
          [[ "${{ steps.bad-engine.outcome }}" == "failure" ]]

  no-credentials:
    name: Fails without credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in without OIDC permission (expect failure)
        id: no-creds
        continue-on-error: true
        uses: ./login
        env:
          VERCEL_API_ORIGIN: http://127.0.0.1:8411
        with:
          team: team_test
          registry: localhost:5000

      - name: Verify it failed
        run: |
          [[ "${{ steps.no-creds.outcome }}" == "failure" ]]

      - name: Wait without OIDC permission (expect failure)
        id: wait-no-creds
        continue-on-error: true
        uses: ./wait-for-optimized-image
        with:
          image: vcr.vercel.com/acme/web/docker-image:latest

      - name: Verify waiting without credentials failed
        run: |
          [[ "${{ steps.wait-no-creds.outcome }}" == "failure" ]]
